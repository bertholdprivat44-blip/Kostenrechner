<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<script>
  (function(){
    try{
      var t = localStorage.getItem('sparrechner_theme_v1');
      if(t && t !== 'midnight') document.documentElement.setAttribute('data-theme', t);
    }catch(e){}
  })();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Budget-Ledger</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#04060c">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Budget-Ledger">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
html,body{height:100%;margin:0}
body{padding:0 !important;overflow:hidden}
.shell{display:flex;flex-direction:column;height:100vh;height:100dvh;padding-top:env(safe-area-inset-top)}
.stage{position:relative;flex:1;min-height:0}
.view{position:absolute;inset:0;width:100%;height:100%;border:0;visibility:hidden;pointer-events:none;overflow-y:auto;-webkit-overflow-scrolling:touch}
iframe.view{overflow:hidden;background:transparent}
.view.on{visibility:visible;pointer-events:auto}
.pad{max-width:560px;margin:0 auto;padding:22px 18px 28px}
.small{font-size:.78rem;color:var(--ink-soft);margin:0 0 4px}
h1.greet{font-family:'Fraunces',serif;font-weight:500;font-size:1.9rem;margin:0 0 18px;line-height:1.15;letter-spacing:-.01em}
.card{background:var(--card);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--card-line);border-radius:18px;padding:16px}
.lbl{margin:0;font-size:.72rem;color:var(--ink-soft);letter-spacing:.03em}
.hero{padding:20px;margin-bottom:12px}
.big{margin:6px 0 12px;font-size:2.4rem;font-weight:600;letter-spacing:-.02em;line-height:1.05}
.pos{color:var(--sage)}.neg{color:var(--danger)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;border:1px solid var(--card-line);border-radius:99px;padding:7px 12px;font-size:.78rem;white-space:nowrap}
.minis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:6px}
.mini{padding:13px 12px}
.val{margin:5px 0 2px;font-size:1.15rem;font-weight:600;white-space:nowrap}
.sub{margin:0;font-size:.68rem;color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
h2.sec{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);margin:22px 0 10px;font-weight:600}
.row{display:flex;align-items:center;gap:14px;width:100%;box-sizing:border-box;text-align:left;font:inherit;color:inherit;background:var(--card);border:1px solid var(--card-line);border-radius:16px;padding:12px 14px;margin-bottom:10px;cursor:pointer;min-height:64px}
.row .ic{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.06);color:var(--brass);display:flex;align-items:center;justify-content:center;flex:none}
.row b{display:block;font-size:.92rem;font-weight:600}
.row small{display:block;font-size:.72rem;color:var(--ink-soft);margin-top:3px}
.row .go{margin-left:auto;color:var(--ink-soft);flex:none}
.sw{display:flex;gap:12px;margin:4px 0 8px}
.sw button{width:44px;height:44px;border-radius:50%;border:2px solid var(--card-line);cursor:pointer;padding:0}
.sw button.on{border-color:var(--ink)}
a.row{text-decoration:none}
.tabbar{display:flex;border-top:1px solid var(--card-line);background:var(--bg);padding:4px 6px calc(6px + env(safe-area-inset-bottom));flex:none}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;color:var(--ink-soft);font:600 10.5px 'IBM Plex Mono',monospace;letter-spacing:.04em;padding:9px 0 2px;min-height:56px;position:relative;cursor:pointer}
.tab.on{color:var(--ink)}
.tab.on::before{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--brass)}
svg{flex:none}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 14px 6px;flex:none;gap:10px}
.topbar .brand{font-family:'Fraunces',serif;font-size:1.02rem}
.tbtns{display:flex;gap:8px;margin-left:auto}
@media (max-width:400px){.topbar .brand{display:none}.tbtns{width:100%}.tbtn{flex:1;justify-content:center}}
.tbtn{position:relative;display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 12px;border:1px solid var(--card-line);border-radius:12px;background:var(--card);color:var(--ink);font:600 .74rem 'IBM Plex Mono',monospace;cursor:pointer}
.tbtn .dot{position:absolute;top:-4px;right:-4px;width:12px;height:12px;border-radius:50%;background:var(--danger);border:2px solid var(--bg)}
.banner{margin:2px 14px 8px;padding:11px 14px;border:1px solid var(--brass);border-radius:14px;background:var(--card);font-size:.78rem;line-height:1.4;display:flex;gap:10px;align-items:center;flex-wrap:wrap;flex:none}
.banner .bb{margin-left:auto;display:flex;gap:8px}
.banner button{font:600 .74rem 'IBM Plex Mono',monospace;height:36px;padding:0 12px;border-radius:10px;border:1px solid var(--card-line);background:transparent;color:var(--ink);cursor:pointer}
.banner button.pri{background:var(--brass);border-color:var(--brass);color:#fff}
.tab.plus{flex:none;width:72px;padding-top:0}
.plusbtn{width:54px;height:54px;border-radius:16px;background:var(--brass);color:#fff;border:4px solid var(--bg);margin-top:-22px;display:flex;align-items:center;justify-content:center}
.qa{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
[hidden]{display:none !important}
.qa[hidden]{display:none}
.qa .scrim{position:absolute;inset:0;background:rgba(0,0,0,.62);border:0;padding:0;cursor:default}
.qa .sheet{position:relative;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;background:var(--bg);border:1px solid var(--card-line);border-radius:22px 22px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
.qa h3{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);margin:0}
.qtiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qtile{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:14px;background:var(--card);border:1px solid var(--card-line);border-radius:14px;color:var(--ink);font:inherit;text-align:left;cursor:pointer;min-height:96px}
.qtile svg{color:var(--brass)}.qtile b{font-size:.95rem}.qtile small{display:block;font-size:.68rem;color:var(--ink-soft);margin-top:3px}
.qbtn{height:52px;border-radius:12px;border:1px solid var(--card-line);background:transparent;color:var(--ink);font:600 .9rem 'IBM Plex Mono',monospace;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer}
.qbtn.pri{background:var(--brass);border-color:var(--brass);color:#fff}
.qbtn.danger{border-color:var(--danger);color:var(--danger)}
.rline{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px dashed var(--card-line);font-size:.82rem}
.rline small{color:var(--ink-soft)}
.stoast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translate(-50%,24px);opacity:0;pointer-events:none;background:var(--bg);color:var(--ink);border:1px solid var(--card-line);padding:11px 16px;border-radius:12px;font-size:.8rem;z-index:60;max-width:88vw;text-align:center;transition:.2s}
.stoast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <span class="brand">Budget-Ledger</span>
    <div class="tbtns">
      <button class="tbtn" id="btnBackup" type="button" aria-label="PDF Download: Backup aller Daten"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg>PDF Download<i class="dot" id="dot" hidden></i></button>
      <button class="tbtn" id="btnRestore" type="button" aria-label="Backup einfügen"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V5M7 9l5-5 5 5M5 20h14"/></svg>Einfügen</button>
      <input type="file" id="restoreFile" accept="application/pdf,.pdf" hidden>
    </div>
  </header>
  <div class="banner" id="banner" hidden role="status"><span id="bannerTxt"></span><span class="bb"><button type="button" id="bnLater">Später</button><button type="button" class="pri" id="bnNow">Jetzt sichern</button></span></div>
  <main class="stage" id="stage">
    <section class="view on" id="v-heute" aria-label="Heute"><div class="pad">
      <p class="small" id="h-date">&nbsp;</p>
      <h1 class="greet" id="h-greet">Hallo, Andrew</h1>
      <div class="card hero">
        <p class="lbl" id="h-lbl">Trading-Ergebnis</p>
        <p class="big" id="h-pnl">–</p>
        <div class="chips"><span class="chip" id="h-n">–</span><span class="chip" id="h-wr">–</span><span class="chip" id="h-acc">–</span></div>
      </div>
      <div class="minis">
        <div class="card mini"><p class="lbl">Payouts</p><p class="val" id="h-pay">–</p><p class="sub" id="h-pay2">&nbsp;</p></div>
        <div class="card mini"><p class="lbl">Rücklage</p><p class="val" id="h-res">–</p><p class="sub" id="h-res2">&nbsp;</p></div>
      </div>
      <h2 class="sec">Schnell erledigen</h2>
      <button class="row" type="button" data-act="trade"><span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span><span><b>Trade eintragen</b><small>Screenshot hochladen oder von Hand</small></span><span class="go">›</span></button>
      <button class="row" type="button" data-act="payout"><span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4M10 12h5M10 16h5"/></svg></span><span><b>Payout buchen</b><small>Eigenbeleg erstellen, 4 Buchungen</small></span><span class="go">›</span></button>
      <button class="row" type="button" data-act="ausgabe"><span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg></span><span><b>Ausgabe buchen</b><small>Challenge, Software, Gebühren</small></span><span class="go">›</span></button>
    </div></section>
    <iframe class="view" id="f-trading" title="Trading Journal" data-src="trading-journal.html?embed=1"></iframe>
    <iframe class="view" id="f-steuer" title="Steuer-Cockpit" data-src="steuer-cockpit.html?embed=1"></iframe>
    <iframe class="view" id="f-sparen" title="Sparrechner" data-src="index.html?embed=1"></iframe>
    <section class="view" id="v-mehr" aria-label="Mehr"><div class="pad">
      <h1 class="greet">Mehr</h1>
      <h2 class="sec" style="margin-top:0">Farbschema</h2>
      <div class="sw" id="sw">
        <button type="button" data-t="midnight" title="Mitternacht" aria-label="Mitternacht" style="background:#4a71e0"></button>
        <button type="button" data-t="redblack" title="Rot-Schwarz" aria-label="Rot-Schwarz" style="background:#e0394a"></button>
        <button type="button" data-t="emerald" title="Smaragd" aria-label="Smaragd" style="background:#22b47a"></button>
        <button type="button" data-t="amber" title="Bernstein" aria-label="Bernstein" style="background:#d99a3c"></button>
      </div>
      <h2 class="sec">Weiteres</h2>
      <button class="row" type="button" data-act="anleitung"><span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.5a2.5 2.5 0 1 1 3.4 2.3c-.7.3-1 .8-1 1.5M12 16.5v.1"/></svg></span><span><b>Anleitung</b><small>Was jede Funktion macht, mit Suche</small></span><span class="go">›</span></button>
      <a class="row" href="start.html"><span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></span><span><b>Klassische Ansicht</b><small>Die bisherige Startseite mit Menü</small></span><span class="go">›</span></a>
    </div></section>
    <iframe class="view" id="f-anleitung" title="Anleitung" data-src="anleitung.html?embed=1"></iframe>
  </main>
  <nav class="tabbar" aria-label="Hauptmenü">
    <button class="tab on" type="button" data-go="heute"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7"/><path d="M6 9.5V20h12V9.5"/></svg>Heute</button>
    <button class="tab" type="button" data-go="trading"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19V5M4 19h16"/><path d="M8 15l3-4 3 2 5-6"/></svg>Trading</button>
    <button class="tab plus" type="button" id="qaBtn" aria-label="Schnell erfassen"><span class="plusbtn"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span></button>
    <button class="tab" type="button" data-go="steuer"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4M10 12h5M10 16h5"/></svg>Steuer</button>
    <button class="tab" type="button" data-go="sparen"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="12" cy="7" rx="7" ry="3"/><path d="M5 7v5c0 1.7 3.1 3 7 3s7-1.3 7-3V7"/><path d="M5 12v5c0 1.7 3.1 3 7 3s7-1.3 7-3v-5"/></svg>Sparen</button>
    <button class="tab" type="button" data-go="mehr"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg>Mehr</button>
  </nav>
</div>
<div class="qa" id="qa" hidden role="dialog" aria-modal="true" aria-label="Schnell erfassen">
  <button class="scrim" type="button" id="qaScrim" aria-label="Schließen"></button>
  <div class="sheet">
    <h3>Schnell erfassen</h3>
    <div class="qtiles">
      <button class="qtile" type="button" data-qa="trade"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19V5M4 19h16"/><path d="M8 15l3-4 3 2 5-6"/></svg><span><b>Trade</b><small>Konto wählen</small></span></button>
      <button class="qtile" type="button" data-qa="payout"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v10M9.5 9.5c0-1.2 1.2-1.8 2.5-1.8s2.5.6 2.5 1.8c0 2.4-5 1.2-5 3.6 0 1.2 1.2 1.8 2.5 1.8s2.5-.6 2.5-1.8"/></svg><span><b>Payout</b><small>Beleg buchen</small></span></button>
      <button class="qtile" type="button" data-qa="ausgabe"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg><span><b>Ausgabe</b><small>Challenge, Software</small></span></button>
      <button class="qtile" type="button" data-qa="auszahlung"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="12" cy="7" rx="7" ry="3"/><path d="M5 7v5c0 1.7 3.1 3 7 3s7-1.3 7-3V7"/><path d="M5 12v5c0 1.7 3.1 3 7 3s7-1.3 7-3v-5"/></svg><span><b>Auszahlung</b><small>am Prop-Konto</small></span></button>
    </div>
    <button class="qbtn pri" type="button" data-qa="scan"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l1.5-2h7L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Screenshot scannen</button>
    <button class="qbtn" type="button" id="qaCancel">Abbrechen</button>
  </div>
</div>
<div class="qa" id="rmodal" hidden role="dialog" aria-modal="true" aria-label="Backup einfügen">
  <button class="scrim" type="button" id="rScrim" aria-label="Schließen"></button>
  <div class="sheet">
    <h3>Backup einfügen</h3>
    <div id="rBody"></div>
    <button class="qbtn pri" type="button" id="rMerge">Ergänzen (nur Fehlendes)</button>
    <button class="qbtn danger" type="button" id="rReplace">Alles ersetzen</button>
    <button class="qbtn" type="button" id="rCancel">Abbrechen</button>
  </div>
</div>
<div class="stoast" id="stoast" role="status"></div>
<script>
const $ = id => document.getElementById(id);
const VIEWS = { heute:'v-heute', trading:'f-trading', steuer:'f-steuer', sparen:'f-sparen', mehr:'v-mehr', anleitung:'f-anleitung' };
const FR = { trading:$('f-trading'), steuer:$('f-steuer'), sparen:$('f-sparen'), anleitung:$('f-anleitung') };
const THEME_KEY = 'sparrechner_theme_v1';
let cur = 'heute';
const W = k => { try{ return FR[k].contentWindow; }catch(e){ return null; } };
const fmt = n => n.toLocaleString('de-DE', { minimumFractionDigits:2, maximumFractionDigits:2 });
const eur = n => '€' + fmt(n);
const signed = n => (n >= 0 ? '+' : '−') + eur(Math.abs(n));

function load(k){ const f = FR[k]; if (f && !f.getAttribute('src')) f.setAttribute('src', f.dataset.src); }
function go(k){
  if (!VIEWS[k]) k = 'heute';
  cur = k; load(k);
  Object.entries(VIEWS).forEach(([n, id]) => $(id).classList.toggle('on', n === k));
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.go === (k === 'anleitung' ? 'mehr' : k)));
  if (k === 'heute') refresh();
  try{ history.replaceState(null, '', '#' + k); }catch(e){}
}
function greet(){
  const d = new Date(), h = d.getHours();
  $('h-greet').textContent = (h < 11 ? 'Guten Morgen' : h < 18 ? 'Guten Tag' : 'Guten Abend') + ', Andrew';
  $('h-date').textContent = d.toLocaleDateString('de-DE', { weekday:'long', day:'numeric', month:'long' });
}
function refresh(){
  greet();
  const now = new Date(), y = String(now.getFullYear()), ym = y + '-' + String(now.getMonth() + 1).padStart(2, '0');
  const month = now.toLocaleDateString('de-DE', { month:'long' });
  try{   // Trading: Ergebnis des laufenden Monats im aktiven Konto
    const w = W('trading'), list = w.activeTrades().filter(t => (t.date || '').startsWith(ym)), s = w.stats(list);
    $('h-lbl').textContent = 'Trading-Ergebnis · ' + month;
    $('h-pnl').textContent = signed(s.pnl || 0); $('h-pnl').className = 'big ' + ((s.pnl || 0) < 0 ? 'neg' : 'pos');
    $('h-n').textContent = s.n + (s.n === 1 ? ' Trade' : ' Trades');
    $('h-wr').textContent = s.wr === null || s.wr === undefined ? 'Winrate –' : 'Winrate ' + fmt(s.wr).replace(',00', '') + ' %';
    $('h-acc').textContent = w.activeAccount().name || 'Konto';
  }catch(e){ $('h-pnl').textContent = '–'; $('h-n').textContent = 'Journal wird geladen …'; }
  try{   // Steuer-Cockpit: Payouts, Gewinn, empfohlene Rücklage
    const w = W('steuer'), d = w.yearData(y), t = w.taxFor(d.profit), n = d.list.filter(e => e.cat === 'Payout').length;
    $('h-pay').textContent = String(n); $('h-pay2').textContent = 'Gewinn ' + y + ': ' + eur(d.profit);
    $('h-res').textContent = t.reserve + ' %'; $('h-res2').textContent = 'Steuer ' + eur(t.total);
  }catch(e){ $('h-pay').textContent = '–'; $('h-res').textContent = '–'; }
}
function act(a){

async function extractData(buf){

const byKey = (a, b, f) => { const seen = new Set(a.map(f)); return a.concat(b.filter(x => !seen.has(f(x)))); };
async function applyRestore(mode){
  const p = pending; if (!p) return; $('rmodal').hidden = true;
  try{
    const jw = await ready('trading'), St = jw.eval('Store'), cur = collectLS(), have = new Set(jw.eval('S.trades.map(t => t.id)')), rep = mode === 'replace';
    // Trades über das Journal selbst speichern (IndexedDB)
    if (rep){ for (const t of jw.eval('S.trades.slice()')) await St.del(t); }
    for (const t of (p.trades || [])) if (rep || !have.has(t.id)) await St.put(JSON.parse(JSON.stringify(t)));
    // Einstellungen & Daten der Seiten
    const out = {};
    if (rep){ Object.keys(cur).forEach(k => localStorage.removeItem(k)); Object.assign(out, p.ls); }
    else {
      Object.assign(out, cur);
      Object.keys(p.ls).forEach(k => {
        const a = (() => { try{ return JSON.parse(cur[k]); }catch(e){ return undefined; } })(), b = (() => { try{ return JSON.parse(p.ls[k]); }catch(e){ return undefined; } })();
        if (cur[k] == null){ out[k] = p.ls[k]; return; }

        else if (k === K.cp && a && b) out[k] = JSON.stringify(Object.assign({}, a, { journal: byKey(a.journal || [], b.journal || [], e => e.id || [e.date, e.type, e.amount, e.ref, e.cat].join('|')), firms: Object.assign({}, b.firms || {}, a.firms || {}) }));

/* ===================== Wöchentliche Backup-Erinnerung ===================== */
const WEEK = 7 * 24 * 3600 * 1000;
async function checkReminder(){
  const now = Date.now();
  try{ if (!localStorage.getItem('bl_first_seen')) localStorage.setItem('bl_first_seen', String(now)); }catch(e){}
  const last = +(localStorage.getItem('bl_backup_last') || localStorage.getItem('bl_first_seen') || now), due = now - last >= WEEK, snooze = +(localStorage.getItem('bl_backup_snooze') || 0);
  let data = true; try{ data = hasData(await gather()); }catch(e){}
  const show = due && data;
  $('dot').hidden = !show;
  $('banner').hidden = !(show && now > snooze);
  if (show){ const days = Math.floor((now - last) / 86400000); $('bannerTxt').textContent = (localStorage.getItem('bl_backup_last') ? 'Letztes Backup vor ' + days + ' Tagen. ' : 'Noch kein Backup gemacht. ') + 'Sichere deine Daten als PDF, damit nichts verloren geht.'; }
}
$('bnNow').addEventListener('click', () => { $('banner').hidden = true; doBackup(); });
$('bnLater').addEventListener('click', () => { try{ localStorage.setItem('bl_backup_snooze', String(Date.now() + 24 * 3600 * 1000)); }catch(e){} $('banner').hidden = true; });
setTimeout(checkReminder, 3000);

if ('serviceWorker' in navigator) window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
</script>
</body>
</html>
